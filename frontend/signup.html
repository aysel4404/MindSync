<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join MindSync - Create Account</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="inline-flex flex-col items-center justify-center mb-2">
                <div class="w-16 h-16 rounded-[42%_58%_50%_50%_/_45%_45%_55%_55%] bg-gradient-to-b from-teal-200 to-pink-300 shadow-lg flex flex-col items-center justify-center relative border border-white/25">
                    <div class="absolute top-1 left-2.5 w-3 h-1.5 bg-white/40 rounded-full rotate-[-15deg]"></div>
                    <div class="absolute bottom-4 left-2 w-1.5 h-1 bg-pink-400/50 rounded-full blur-[0.5px]"></div>
                    <div class="absolute bottom-4 right-2 w-1.5 h-1 bg-pink-400/50 rounded-full blur-[0.5px]"></div>
                    <div class="flex items-center gap-3.5 mb-0.5 relative z-10">
                        <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
                        <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
                    </div>
                    <div class="w-2.5 h-1 border-b-2 border-slate-900 rounded-b-full"></div>
                </div>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Create your account</h1>
            <p class="text-sm text-slate-400">Start syncing your productivity with your peace of mind.</p>
        </div>

        <form id="signupForm" class="space-y-4" onsubmit="handleSignup(event)">
            <div class="space-y-1">
                <label for="name" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Full Name</label>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="name" required placeholder="John Doe" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-teal-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="col-span-1 space-y-1">
                    <label for="age" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Age</label>
                    <input type="number" id="age" required min="1" max="120" placeholder="21" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-teal-500 transition">
                </div>
                <div class="col-span-2 space-y-1">
                    <label for="email" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Email Address</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" required placeholder="name@domain.com" 
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-teal-500 transition">
                    </div>
                </div>
            </div>

            <div class="space-y-1">
                <label for="password" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" required minlength="6" placeholder="••••••••" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-11 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-teal-500 transition">
                    <button type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" class="absolute right-4 top-3.5 text-slate-500 hover:text-slate-300 text-sm cursor-pointer">
                        <i id="passwordToggleIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                </div>
                <p class="text-[11px] text-slate-500 mt-1">Must be at least 6 characters long.</p>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition cursor-pointer mt-2 shadow-lg shadow-teal-900/20">
                Sign Up
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800/60">
            <p class="text-xs text-slate-400">Already have an account? <a href="/" class="text-teal-400 hover:underline font-medium">Log In</a></p>
        </div>
    </div>

    <script>
    function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    }

    async function handleSignup(event) {
        event.preventDefault();
        
        // 1. Collect form inputs matching your template element IDs
        const nameInput = document.getElementById('name').value.trim();
        const ageInput = document.getElementById('age').value;
        const emailInput = document.getElementById('email').value.trim();
        const passwordInput = document.getElementById('password').value;

        console.log("Initiating registration request..");

        try {
            const response = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    name: nameInput, 
                    age: ageInput, 
                    email: emailInput, 
                    password: passwordInput 
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // 2. Cache details locally inside browser storage immediately upon success ✨
                localStorage.setItem('user_full_name', nameInput);
                localStorage.setItem('user_age', ageInput);
                localStorage.setItem('user_email', emailInput);
                
                // Derive a clean structural User ID from their display name strings
                const generatedId = nameInput.toLowerCase().replace(/\s+/g, '_') + Math.floor(Math.random() * 100);
                localStorage.setItem('user_id', generatedId);

                alert("🎉 Account created successfully! Syncing your data profile elements...");
                
                // 3. Forward straight to your operational dashboard workspace panel
                window.location.href = '/dashboard'; 
            } else {
                alert(data.message || "Registration failed.");
            }
        } catch (err) {
            console.error("Networking connection error during registration:", err);
            alert("Could not reach backend database pipeline.");
        }
    }
</script>
</body>
</html>
