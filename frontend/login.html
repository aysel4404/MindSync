<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindSync</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="inline-flex flex-col items-center justify-center mb-2">
                <div class="w-16 h-16 rounded-[42%_58%_50%_50%_/_45%_45%_55%_55%] bg-gradient-to-b from-teal-200 to-pink-300 shadow-lg flex flex-col items-center justify-center relative border border-white/25">
                    <div class="absolute top-1 left-2.5 w-3 h-1.5 bg-white/40 rounded-full rotate-[-15deg]"></div>
                    <div class="absolute bottom-4 left-2 w-1.5 h-1 bg-pink-400/50 rounded-full blur-[0.5px]"></div>
                    <div class="absolute bottom-4 right-2 w-1.5 h-1 bg-pink-400/50 rounded-full blur-[0.5px]"></div>
                    <div class="flex items-center gap-3.5 mb-0.5 relative z-10">
                        <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
                        <div class="w-1.5 h-1.5 bg-slate-900 rounded-full"></div>
                    </div>
                    <div class="w-2.5 h-1 border-b-2 border-slate-900 rounded-b-full"></div>
                </div>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Welcome back</h1>
            <p class="text-sm text-slate-400">Log in to consult Squishy and organize your tasks.</p>
        </div>

        <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
            <div class="space-y-1">
                <label for="identifier" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Email or User ID</label>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="identifier" required placeholder="Email or User ID" 
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-teal-500 transition">
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex items-center justify-between">
                    <label for="password" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                    <a href="#" onclick="handleForgotPassword()" class="text-xs text-pink-400 hover:underline font-medium">Forgot Password?</a>
                </div>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-11 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-teal-500 transition">
                    <button type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" class="absolute right-4 top-3.5 text-slate-500 hover:text-slate-300 text-sm cursor-pointer">
                        <i id="passwordToggleIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition cursor-pointer mt-2 shadow-lg shadow-teal-900/20">
                Log In
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800/60">
            <p class="text-xs text-slate-400">New to MindSync? <a href="/signup" class="text-teal-400 hover:underline font-medium">Create an account</a></p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        }

        async function handleLogin(event) {
            event.preventDefault();
            console.log("Form submission caught. Initiating backend verification...");
            
            const identifierInput = document.getElementById('identifier').value.trim();
            const passwordInput = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: identifierInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Cache session details to local storage
                    localStorage.setItem('user_full_name', data.user_full_name);
                    localStorage.setItem('username', data.user_full_name); 
                    console.log(`👤 Active user session secured for: ${data.user_full_name}`);
                    
                    // Route directly to dashboard
                    window.location.href = '/dashboard';
                } else {
                    alert(data.message || "Login authentication rejected.");
                }
            } catch (err) {
                console.error("Networking connection error:", err);
                alert("Could not reach backend server database pipeline.");
            }
        }

        function handleForgotPassword() {
            const id = document.getElementById('identifier').value;
            if(!id) {
                alert("Please enter your Email or User ID in the input field first so we can find your account.");
            } else {
                alert(`A password reset link has been dispatched to the account recovery channel for: ${id}`);
            }
        }
    </script>
</body>
</html>
